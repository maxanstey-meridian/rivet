version: "3"

tasks:
    dev:
        desc: Start docs dev server
        dir: docs
        cmds:
            - corepack pnpm docs:dev

    docs:dev:
        desc: Start docs dev server
        dir: docs
        cmds:
            - corepack pnpm docs:dev

    docs:build:
        desc: Build docs
        dir: docs
        cmds:
            - corepack pnpm docs:build

    analyze:
        desc: Refresh GitNexus code intelligence index
        cmds:
            - corepack pnpm analyze

    gitnexus:status:
        desc: Show GitNexus index status
        cmds:
            - corepack pnpm exec gitnexus status

    build:
        desc: Build solution
        cmds:
            - dotnet build ./Rivet.slnx

    samples:build:
        desc: Build sample projects
        cmds:
            - dotnet build ./samples/ContractApi/ContractApi.csproj
            - dotnet build ./samples/AnnotationApi/AnnotationApi.csproj
            - dotnet build ./samples/TypeShowcase/TypeShowcase.csproj
            - dotnet build ./samples/ImportDemo/ImportDemo.csproj
            - dotnet build ./samples/FunctionsApi/FunctionsApi.csproj

    test:functions:
        desc: Run real Azure Functions host and contract checks (Core Tools v4 required)
        cmds:
            - python3 -m unittest tools/test_functions_host.py -v

    ci:
        desc: Run standard checks plus the real Functions host gate
        cmds:
            - task: check
            - task: test:functions

    test:
        desc: Run test suite
        cmds:
            - dotnet test ./Rivet.slnx
            - python3 -m unittest tools/test_roundtrip_audit.py -v

    format:
        desc: Format C# projects
        cmds:
            - dotnet csharpier format .
            - dotnet format ./Rivet.slnx analyzers --severity warn

    format:verbose:
        desc: Verify C# formatting
        cmds:
            - dotnet csharpier check .
            - dotnet format ./Rivet.slnx analyzers --severity warn --verify-no-changes --verbosity minimal

    check:
        desc: Run build, tests, samples, and docs build
        cmds:
            - task: build
            - task: test
            - task: samples:build
            - task: docs:build

    pack:
        desc: Pack NuGet packages
        cmds:
            - dotnet pack ./Rivet.Attributes/Rivet.Attributes.csproj --configuration Release --output ./nupkg
            - dotnet pack ./Rivet.Tool/Rivet.Tool.csproj --configuration Release --output ./nupkg

    install:
        desc: Install JavaScript dependencies
        cmds:
            - dotnet tool restore
            - corepack pnpm install --frozen-lockfile
            - corepack pnpm --dir docs install --frozen-lockfile
            - corepack pnpm --dir Rivet.Tests/js install --frozen-lockfile
