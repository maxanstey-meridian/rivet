name: Release platform binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # smoke: true where the runner can execute the rid natively.
          - { rid: osx-arm64, os: macos-latest, smoke: true }
          - { rid: osx-x64, os: macos-latest, smoke: false }
          - { rid: linux-x64, os: ubuntu-latest, smoke: true }
          - { rid: win-x64, os: ubuntu-latest, smoke: false }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained binary
        run: dotnet publish Rivet.Tool -c Release -r ${{ matrix.rid }} --self-contained -o ./publish

      - name: Rename binary
        run: |
          cd publish
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv Rivet.Tool.exe rivet-${{ matrix.rid }}.exe
          else
            mv Rivet.Tool rivet-${{ matrix.rid }}
          fi

      - name: Package publish directory
        run: |
          tar -czf rivet-${{ matrix.rid }}.tar.gz -C ./publish .

      # Runs the binary from the extracted tarball, as rivet-ts's downloader
      # does, in every input mode: --project (out-of-process MSBuild build
      # host), loose .cs files, --from contract JSON and --from-openapi.
      - name: Smoke test extracted binary
        if: matrix.smoke
        run: |
          set -euo pipefail
          mkdir -p smoke/bin
          tar -xzf rivet-${{ matrix.rid }}.tar.gz -C smoke/bin
          rivet=./smoke/bin/rivet-${{ matrix.rid }}
          dotnet restore samples/ContractApi/ContractApi.csproj
          "$rivet" --project samples/ContractApi/ContractApi.csproj --security bearer --output smoke/project
          "$rivet" --from-openapi Rivet.Tests/Fixtures/openapi-petstore-v3.json --namespace PetStore --output smoke/petstore
          "$rivet" smoke/petstore --output smoke/files
          "$rivet" --from Rivet.Tests/Fixtures/contract-sample.json --output smoke/from
          test -s smoke/project/openapi.json
          test -s smoke/files/openapi.json
          test -s smoke/from/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: rivet-${{ matrix.rid }}
          path: ./rivet-${{ matrix.rid }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
